<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearCut — 画像の背景を削除</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19283b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:48px 24px}header{text-align:center;margin-bottom:32px}.brand{font-weight:800;color:#2563eb;letter-spacing:.06em}h1{font-size:clamp(26px,5vw,40px);margin:16px 0}p{color:#65758b;line-height:1.8}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 8px 32px #243b5308}.drop{display:block;text-align:center;border:2px dashed #b9cae4;border-radius:14px;padding:34px 20px;cursor:pointer;background:#f8faff;transition:.2s}.drop:hover,.drop.over{border-color:#2563eb;background:#eff6ff}.drop strong{display:block;font-size:18px;margin:12px 0}.icon{font-size:32px;color:#2563eb}.hint{font-size:13px;color:#65758b}.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.drop:focus-within{outline:3px solid #93c5fd;outline-offset:3px}.actions{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:24px}button,.download{border:0;border-radius:10px;background:#2563eb;color:white;padding:14px 24px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px}button:disabled{background:#9aacc7;cursor:not-allowed}.download{background:#0f766e}#downloads{gap:12px}#downloads .download{font-size:13px;padding:12px 14px}.status{min-height:28px;text-align:center;margin:16px 0 0;overflow-wrap:anywhere}.status.error{color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}h2{font-size:16px;margin:0 0 16px}.preview{height:340px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;overflow:hidden}.checker{background-color:white;background-image:linear-gradient(45deg,#e2e8f0 25%,transparent 25%),linear-gradient(-45deg,#e2e8f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e2e8f0 75%),linear-gradient(-45deg,transparent 75%,#e2e8f0 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{color:#65758b;padding:20px;text-align:center}.spinner{width:18px;height:18px;border:2px solid #ffffff60;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;font-size:13px;color:#65758b;margin-top:28px}@media(max-width:650px){main{padding:28px 16px}.grid{grid-template-columns:1fr}.card{padding:18px}.preview{height:280px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main>
<header><div class="brand">✦ ClearCut</div><h1>背景を消して、主役を残す。</h1><p>画像をアップロードするだけ。AIが輪郭を認識し、背景を透明にします。</p></header>
<section class="card" aria-label="画像アップロード">
<label class="drop" id="drop"><span class="icon" aria-hidden="true">↑</span><strong>画像をドラッグ＆ドロップ</strong><span>またはクリックしてファイルを選択</span><br><span class="hint">JPEG・PNG・WebP・HEICなど / 最大20MB・2500万画素</span><input class="file-input" id="file" type="file" accept="image/*,.heic,.heif"></label>
<div class="actions"><button id="remove" disabled><span class="spinner" id="spinner" hidden></span><span id="buttonText">背景を削除（輪郭抽出）</span></button></div>
<p class="status" id="status" role="status" aria-live="polite">画像を選択してください。</p>
</section>
<div class="grid">
<section class="card"><h2>元画像</h2><div class="preview"><img id="original" alt="元画像のプレビュー" hidden><span class="placeholder" id="originalPlaceholder">ここに元画像が表示されます</span></div></section>
<section class="card"><h2>背景を除去した画像</h2><div class="preview checker"><img id="result" alt="背景を透過した画像" hidden><span class="placeholder" id="resultPlaceholder">処理後の画像が表示されます</span></div><div class="actions" id="downloads" hidden><a class="download" id="download" download="image_original.png">高画質版をダウンロード</a><a class="download" id="downloadLite" download="image_lite.png">軽量版をダウンロード</a></div><p class="hint" id="sizes" hidden></p></section>
</div>
<footer>初回の処理にはモデルのダウンロードで時間がかかる場合があります。<br>画像はサーバーで処理し、アプリ側ではファイルとして保存しません。</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let selectedFile = null, originalUrl = null, resultUrl = null, busy = false;
function status(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }
function clearResult() {
  resultUrl = null; $('result').hidden = true; $('result').removeAttribute('src');
  $('resultPlaceholder').hidden = false; $('downloads').hidden = true; $('sizes').hidden = true;
  $('download').removeAttribute('href'); $('downloadLite').removeAttribute('href');
}
function selectFile(file) {
  if (busy || !file) return;
  if (file.size > 20 * 1024 * 1024) { status('画像は20MB以下にしてください。', true); return; }
  if (!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) { status('画像ファイルを選択してください。', true); return; }
  selectedFile = file; clearResult();
  if (originalUrl) URL.revokeObjectURL(originalUrl);
  originalUrl = URL.createObjectURL(file);
  $('original').src = originalUrl; $('original').hidden = false; $('originalPlaceholder').hidden = true;
  $('remove').disabled = false; status(`${file.name} を選択しました。`);
}
$('original').onerror = () => { $('original').hidden = true; $('originalPlaceholder').hidden = false; $('originalPlaceholder').textContent = 'ブラウザでプレビューできない形式です。背景除去は実行できます。'; };
$('original').onload = () => { $('originalPlaceholder').textContent = 'ここに元画像が表示されます'; };
$('file').addEventListener('change', event => selectFile(event.target.files[0]));
for (const name of ['dragenter', 'dragover']) $('drop').addEventListener(name, event => { event.preventDefault(); if (!busy) $('drop').classList.add('over'); });
for (const name of ['dragleave', 'drop']) $('drop').addEventListener(name, event => { event.preventDefault(); $('drop').classList.remove('over'); });
$('drop').addEventListener('drop', event => selectFile(event.dataTransfer.files[0]));
window.addEventListener('dragover', event => event.preventDefault());
window.addEventListener('drop', event => event.preventDefault());
$('remove').addEventListener('click', async () => {
  if (!selectedFile || busy) return;
  busy = true; $('remove').disabled = true; $('file').disabled = true;
  $('spinner').hidden = false; $('buttonText').textContent = '背景を除去しています…';
  $('drop').setAttribute('aria-disabled', 'true'); clearResult(); status('処理中です。初回はモデルをダウンロードします。');
  try {
    const body = new FormData(); body.append('image', selectedFile); body.append('variants', 'both');
    const response = await fetch('/remove-bg', { method: 'POST', body });
    if (!response.ok) { const data = await response.json().catch(() => ({})); throw new Error(data.error || '処理に失敗しました。再試行してください。'); }
    const data = await response.json();
    if (![data.original, data.lite].every(image => image?.data_url?.startsWith('data:image/png;base64,'))) throw new Error('サーバーから正しい画像を受信できませんでした。');
    resultUrl = data.original.data_url;
    $('result').src = resultUrl; $('result').hidden = false; $('resultPlaceholder').hidden = true;
    const filename = selectedFile.name.replace(/\.[^.]+$/, '') || 'image';
    $('download').href = resultUrl; $('download').download = filename + '_original.png';
    $('downloadLite').href = data.lite.data_url; $('downloadLite').download = filename + '_lite.png';
    $('downloads').hidden = false;
    const describe = image => `${image.width} × ${image.height}px / ${(image.size_bytes / 1024).toFixed(1)} KB`;
    $('sizes').textContent = `高画質版: ${describe(data.original)} ｜ 軽量版: ${describe(data.lite)}`;
    $('sizes').hidden = false;
    status('背景を除去しました。高画質版・軽量版をダウンロードできます。');
  } catch (error) { status(error.message || '通信に失敗しました。', true); }
  finally { busy = false; $('remove').disabled = false; $('file').disabled = false; $('spinner').hidden = true; $('buttonText').textContent = '背景を削除（輪郭抽出）'; $('drop').removeAttribute('aria-disabled'); }
});
window.addEventListener('pagehide', () => { if (originalUrl) URL.revokeObjectURL(originalUrl); });
</script>
</body>
</html>
